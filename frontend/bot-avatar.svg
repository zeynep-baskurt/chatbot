<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring / Circle Background -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" />

  <!-- Antenna -->
  <line x1="64" y1="36" x2="64" y2="24" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  <circle cx="64" cy="20" r="6" fill="#38bdf8" filter="url(#glow)" />

  <!-- Side Ears -->
  <rect x="22" y="52" width="8" height="20" rx="4" fill="#cbd5e1" />
  <rect x="98" y="52" width="8" height="20" rx="4" fill="#cbd5e1" />

  <!-- Robot Head -->
  <rect x="28" y="34" width="72" height="58" rx="18" fill="url(#headGrad)" />

  <!-- Visor / Face Screen -->
  <rect x="36" y="44" width="56" height="34" rx="12" fill="url(#visorGrad)" />

  <!-- Glowing Eyes -->
  <circle cx="50" cy="60" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="78" cy="60" r="7" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="52" cy="58" r="2.5" fill="#ffffff" />
  <circle cx="80" cy="58" r="2.5" fill="#ffffff" />

  <!-- Friendly Smile -->
  <path d="M 54 70 Q 64 76 74 70" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Body / Neck Collar -->
  <path d="M 44 92 C 44 92, 54 100, 64 100 C 74 100, 84 92, 84 92 L 78 108 L 50 108 Z" fill="#e2e8f0" />
</svg>
